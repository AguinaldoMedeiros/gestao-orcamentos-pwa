name: Build complete Windows application
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - name: Extract verified application source
        working-directory: .
        shell: pwsh
        run: |
          if ((Get-FileHash Gestao-de-Orcamentos-Fonte.zip -Algorithm SHA256).Hash -ne '33131e6e2d9a5dfb598488b1bc81ed9ca4cc6d81aaf67b42c3e37b0a2edb6978') { throw 'Source checksum mismatch' }
          Expand-Archive -Path Gestao-de-Orcamentos-Fonte.zip -DestinationPath app
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm test
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Verify packaged application starts offline twice
        shell: pwsh
        run: |
          $setup = (Get-ChildItem release/*-Windows-x64.exe | Select-Object -First 1).FullName
          $installDir = Join-Path $env:LOCALAPPDATA 'GestaoOrcamentos-QA-Instalado'
          $installer = Start-Process -FilePath $setup -ArgumentList '/S',('/D='+$installDir) -PassThru
          if (-not $installer.WaitForExit(120000) -or $installer.ExitCode -ne 0) { throw 'Installer failed' }
          $exe = Join-Path $installDir 'Gestão de Orçamentos.exe'
          if (-not (Test-Path $exe)) { throw 'Installed executable missing' }
          $result = Join-Path $env:APPDATA 'GestaoOrcamentos-QA/smoke-ok.json'
          1..2 | ForEach-Object {
            Remove-Item $result -ErrorAction SilentlyContinue
            $process = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -PassThru
            if (-not $process.WaitForExit(45000)) { Stop-Process -Id $process.Id; throw 'Application startup timeout' }
            if ($process.ExitCode -ne 0 -or -not (Test-Path $result)) { throw 'Application failed to start offline' }
            $check = Get-Content $result -Raw | ConvertFrom-Json
            if (-not $check.storage -or -not $check.ui -or $check.origin -ne 'orcamentos://app') { throw 'Startup assertions failed' }
            if ($_ -eq 2 -and -not $check.previous) { throw 'Persistence after restart failed' }
            Get-Content $result
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Gestao-de-Orcamentos-Windows-completo
          path: |
            app/release/*.exe
            app/release/*.blockmap
